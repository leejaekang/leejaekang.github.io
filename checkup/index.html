<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="재무제표 숫자를 넣으면 같은 업종·규모의 회사들과 비교한 결과지가 나옵니다. 회원가입 없이 무료로 쓸 수 있고 입력한 숫자는 저장하거나 전송하지 않습니다.">
<meta property="og:title" content="재무 건강검진기">
<meta property="og:description" content="우리 회사 재무 상태, 같은 업종과 비교해 보세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://leejaekang.github.io/checkup/">
<style>html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>재무 건강검진기</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 왼쪽 문진표(입력), 오른쪽 결과통보서. 건강검진 결과지의 판정·참고범위 형식을 따른다 */
:root{
  --bg:#eef3f2; --sheet:#ffffff; --ink:#14282b; --muted:#566c6f; --line:#cfdcda; --soft:#e3ecea;
  --accent:#0b6e69; --accent-ink:#ffffff; --band:#c5dcd8;
  --good:#17794f; --good-bg:#e0f3e9; --ok:#47636a; --ok-bg:#e6edee;
  --warn:#9a5f00; --warn-bg:#fbefd6; --crit:#b3261e; --crit-bg:#fbe4e1;
  --display:"Gothic A1","Malgun Gothic",sans-serif; --body:"IBM Plex Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1b1d; --sheet:#172628; --ink:#e4efed; --muted:#9db3b2; --line:#2e4346; --soft:#20332f;
  --accent:#4cc2b6; --accent-ink:#06211f; --band:#2c5752;
  --good:#6fd6a3; --good-bg:#17382a; --ok:#a9bfc2; --ok-bg:#25393c;
  --warn:#eebb63; --warn-bg:#3b2d11; --crit:#f4948c; --crit-bg:#451f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1d; --sheet:#172628; --ink:#e4efed; --muted:#9db3b2; --line:#2e4346; --soft:#20332f;
  --accent:#4cc2b6; --accent-ink:#06211f; --band:#2c5752;
  --good:#6fd6a3; --good-bg:#17382a; --ok:#a9bfc2; --ok-bg:#25393c;
  --warn:#eebb63; --warn-bg:#3b2d11; --crit:#f4948c; --crit-bg:#451f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);word-break:keep-all}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 24px}
h1{font:900 clamp(26px,4vw,36px)/1.2 var(--display);margin:0;letter-spacing:-.02em}
header p{margin:0;color:var(--muted)}
/* 문진표 */
form{min-width:0;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:14px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font:700 13px var(--display);color:var(--accent);padding:0 0 4px;letter-spacing:.02em}
.f{display:grid;grid-template-columns:minmax(0,1fr) 124px;align-items:center;gap:8px}
.f label{font-size:14px}
.f small,.opt{color:var(--muted);font-size:12px}
input,select{width:100%;font:500 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0}
input{text-align:right;font-variant-numeric:tabular-nums}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stack{display:grid;gap:4px}.stack label{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px}
.notice{font-size:13px;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:600 14px var(--body);border-radius:4px;padding:8px 12px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* 결과통보서 */
.report{grid-template-columns:minmax(0,1fr);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:clamp(18px,3vw,32px);display:grid;gap:26px;min-width:0}
.rhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.rhead strong{font:900 20px var(--display)}
.rhead span{color:var(--muted);font-size:13px}
.example{display:inline-block;font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:1px 8px;border-radius:3px;margin-left:8px;vertical-align:2px}
.summary{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 24px;align-items:center}
.score{font:900 64px/1 var(--display);font-variant-numeric:tabular-nums}
.score small{font:500 16px var(--body);color:var(--muted);margin-left:2px}
.verdict{font:700 19px/1.45 var(--display);margin:0;text-wrap:balance}
.summary p.sub{margin:4px 0 0;color:var(--muted)}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap}
.s-good{color:var(--good);background:var(--good-bg)}.s-ok{color:var(--ok);background:var(--ok-bg)}.s-warn{color:var(--warn);background:var(--warn-bg)}.s-crit{color:var(--crit);background:var(--crit-bg)}
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.area{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;gap:2px}
.area b{font:700 13px var(--display);color:var(--muted)}
.area i{font:900 26px/1.2 var(--display);font-style:normal;font-variant-numeric:tabular-nums}
h2{font:700 16px var(--display);margin:0 0 10px}
.report>*{min-width:0}
.flags{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.flags li{padding:8px 12px;border-radius:4px;background:var(--crit-bg);color:var(--crit);font-weight:500}
.money{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.money li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;border-bottom:1px solid var(--soft);padding-bottom:10px}
.money b{font-weight:600}.money em{font:900 20px var(--display);font-style:normal;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.money span{grid-column:1/-1;color:var(--muted);font-size:13.5px}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px;font-variant-numeric:tabular-nums}
th{font:600 12.5px var(--body);color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--ink)}
td{padding:8px;border-bottom:1px solid var(--soft);vertical-align:middle}
tr.grp td{font:700 13px var(--display);color:var(--accent);padding-top:14px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;white-space:nowrap}
.mine{font-weight:600}
.bar{position:relative;height:14px;min-width:150px;background:var(--soft);border-radius:2px}
.bar .iq{position:absolute;top:0;bottom:0;left:25%;width:50%;background:var(--band)}
.bar .med{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--muted)}
.bar .me{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ink);border:2px solid var(--sheet)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:400}
.tips{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.tips b{display:block;font-weight:600}.tips span{color:var(--muted)}
.foot{border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--muted);display:grid;gap:8px}
.foot p{margin:0}.foot .contact{color:var(--ink);font-size:14.5px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}form{position:static;max-height:none}.areas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.summary{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.bar .me{transition:left .25s ease}}
@media print{form,header,.btns{display:none!important}.wrap{display:block;padding:0}body{background:#fff}.report{border:0;padding:0}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>재무 건강검진기</h1>
    <p>재무제표 숫자를 넣으면 같은 업종·규모 회사들과 비교한 결과지가 나옵니다.</p>
  </header>

  <form id="form" autocomplete="off">
    <fieldset>
      <legend>회사 정보</legend>
      <div class="stack"><label for="industry">업종</label><select id="industry"></select></div>
      <div class="stack"><label for="unit">입력 단위</label>
        <select id="unit"><option value="0.01">백만원</option><option value="0.00001">천원</option><option value="0.00000001">원</option><option value="1">억원</option></select></div>
    </fieldset>
    <fieldset>
      <legend>손익계산서 (올해)</legend>
      <div class="f"><label for="rev">매출액</label><input id="rev" inputmode="decimal"></div>
      <div class="f"><label for="revp">매출액 (작년)</label><input id="revp" inputmode="decimal"></div>
      <div class="f"><label for="cost">매출원가 <span class="opt">선택</span></label><input id="cost" inputmode="decimal"></div>
      <div class="f"><label for="op">영업이익 <span class="opt">손실은 -</span></label><input id="op" inputmode="decimal"></div>
      <div class="f"><label for="ni">당기순이익 <span class="opt">손실은 -</span></label><input id="ni" inputmode="decimal"></div>
      <div class="f"><label for="int">이자비용 <span class="opt">없으면 0</span></label><input id="int" inputmode="decimal"></div>
    </fieldset>
    <fieldset>
      <legend>재무상태표 (올해 말)</legend>
      <div class="f"><label for="ta">자산총계</label><input id="ta" inputmode="decimal"></div>
      <div class="f"><label for="ca">유동자산</label><input id="ca" inputmode="decimal"></div>
      <div class="f"><label for="ar">매출채권 <span class="opt">선택</span></label><input id="ar" inputmode="decimal"></div>
      <div class="f"><label for="inv">재고자산 <span class="opt">선택</span></label><input id="inv" inputmode="decimal"></div>
      <div class="f"><label for="tl">부채총계</label><input id="tl" inputmode="decimal"></div>
      <div class="f"><label for="cl">유동부채</label><input id="cl" inputmode="decimal"></div>
    </fieldset>
    <div class="notice" id="notice" hidden></div>
    <div class="btns">
      <button type="button" id="clear">모두 지우기</button>
      <button type="button" id="sample">예시 숫자 넣기</button>
    </div>
    <div class="opt">입력한 숫자는 이 화면에서만 계산하고 저장하거나 전송하지 않습니다.</div>
  </form>

  <main class="report" id="report" aria-live="polite"></main>
</div>

  gpm:"제품·거래처별 마진을 나눠 보세요. 손해 보는 거래가 평균 뒤에 숨어 있는 경우가 많습니다.",
  opm:"판매관리비에서 매출보다 빠르게 늘어난 항목을 찾아보세요.",
  npm:"영업이익과 차이가 크면 이자비용과 일회성 손실을 먼저 확인하세요.",
  roa:"매출에 기여하지 않는 자산(유휴 부동산, 대여금 등)이 있는지 확인하세요.",
  debt:"차입 만기와 금리를 정리하고, 은행 심사 때 어떻게 보일지 미리 점검하세요.",
  equity:"이익이 쌓이는 속도보다 빚이 빨리 늘고 있는지 3년 추이를 보세요.",
  current:"1년 안에 돌아오는 차입금 일정과 현금 흐름을 월별로 맞춰 보세요.",
  icr:"금리 재협상이나 차입금 상환 순서를 검토할 때입니다.",
  ard:"거래처별 연령표를 만들어 오래된 채권부터 회수하세요. 부실 거래처 점검도 함께 하세요.",
  invd:"오래된 재고를 품목별로 추려 보세요. 평가손실과 보관비가 함께 걸려 있습니다.",
  turn:"매출 대비 자산이 무거운 편입니다. 재고, 채권, 유휴 설비 중 어디인지 나눠 보세요.",
  growth:"시장이 줄었는지, 우리 몫이 줄었는지 주요 거래처별로 나눠 보세요."
};

function fmt(v,f){
  if(v==null||!isFinite(v))return "–";
  const n=(x,d)=>x.toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
  if(f==="pct")return n(v,1)+"%";
  if(f==="pct0")return n(v,0)+"%";
  if(f==="day")return n(v,0)+"일";
  return n(v,2)+"배";
}
function won(eok){
  const a=Math.abs(eok);
  if(a>=1)return (a>=100?Math.round(a).toLocaleString("ko-KR"):a.toFixed(1))+"억원";
  return Math.round(a*10000).toLocaleString("ko-KR")+"만원";
}
function sizeBand(a){return a<100?"100억 미만":a<300?"100억~300억":a<1000?"300억~1,000억":"1,000억 이상";}
/* 분위수 표(5%~95%, 5% 간격)에서 내 값의 위치 찾기. 같은 값이 겹치는 구간은 중간을 쓴다 */
function pctile(q,v){
  if(v<q[0])return 2.5;
  if(v>q[18])return 97.5;
  const at=[];
  for(let i=0;i<19;i++)if(q[i]===v)at.push((i+1)*5);
  if(at.length)return (at[0]+at[at.length-1])/2;
  for(let i=0;i<18;i++)if(v>q[i]&&v<q[i+1])return (i+1)*5+5*(v-q[i])/(q[i+1]-q[i]);
  return 50;
}
/* 항목 판정은 막대와 맞춘다: 진한 구간(중간 50%) 안이면 보통 */
function itemGrade(s){return s>=75?["양호","s-good"]:s>=25?["보통","s-ok"]:s>=10?["주의","s-warn"]:["정밀 점검","s-crit"];}
/* 영역·종합 점수는 여러 항목의 평균이라 양 끝으로 잘 가지 않아 기준을 좁게 둔다 */
function grade(s){return s>=60?["양호","s-good"]:s>=40?["보통","s-ok"]:s>=25?["주의","s-warn"]:["정밀 점검","s-crit"];}
function pick(ind,size,k){
  const c=B.cell[ind+"|"+size];
  if(!ind){const s=B.size[size];return s&&s[k]?{q:s[k],n:s.n,label:"전 업종 · 자산 "+size}:{q:B.all[k],n:B.all.n,label:"전 업종"}}
  if(c&&c[k])return {q:c[k],n:c.n,label:ind+" · 자산 "+size};
  const d=B.ind[ind];
  if(d&&d[k])return {q:d[k],n:d.n,label:ind+" 전체 (규모 무관)"};
  const s=B.size[size];
  if(s&&s[k])return {q:s[k],n:s.n,label:"전 업종 · 자산 "+size};
  return {q:B.all[k],n:B.all.n,label:"전 업종"};
}
function read(){
  const u=parseFloat($("unit").value),o={};
  for(const k of FIELDS){
    const t=$(k).value.replace(/[,\s]/g,"").replace(/^△|^▲/,"-").replace(/^\((.*)\)$/,"-$1");
    if(t===""){o[k]=null;continue}
    const v=parseFloat(t);
    o[k]=isNaN(v)?NaN:v*u;
  }
  return o;
}
function compute(d){
  const r={};
  const ok=(...a)=>a.every(x=>x!=null&&!isNaN(x));
  if(ok(d.rev,d.cost)&&d.rev>0)r.gpm=(d.rev-d.cost)/d.rev*100;
  if(ok(d.rev,d.op)&&d.rev>0)r.opm=d.op/d.rev*100;
  if(ok(d.rev,d.ni)&&d.rev>0)r.npm=d.ni/d.rev*100;
  if(ok(d.ta,d.ni)&&d.ta>0)r.roa=d.ni/d.ta*100;
  if(ok(d.ta,d.tl)&&d.ta>0){
    const eq=d.ta-d.tl;
    r.equity=eq/d.ta*100;
    if(eq>0)r.debt=d.tl/eq*100;
  }
  if(ok(d.ca,d.cl)&&d.cl>0)r.current=d.ca/d.cl*100;
  if(ok(d.op,d.int)&&d.int>0)r.icr=d.op/d.int;
  if(ok(d.ar,d.rev)&&d.rev>0&&d.ar>0)r.ard=d.ar/d.rev*365;
  if(ok(d.inv,d.cost)&&d.cost>0&&d.inv>0)r.invd=d.inv/d.cost*365;
  if(ok(d.rev,d.ta)&&d.ta>0)r.turn=d.rev/d.ta;
  if(ok(d.rev,d.revp)&&d.revp>0)r.growth=(d.rev/d.revp-1)*100;
  return r;
}
function check(d){
  const w=[];
  if(FIELDS.some(k=>Number.isNaN(d[k])))w.push("숫자가 아닌 값이 있습니다. 숫자만 입력해 주세요.");
  if(d.ca!=null&&d.ta!=null&&d.ca>d.ta)w.push("유동자산이 자산총계보다 큽니다. 입력값을 확인해 주세요.");
  if(d.cl!=null&&d.tl!=null&&d.cl>d.tl)w.push("유동부채가 부채총계보다 큽니다. 입력값을 확인해 주세요.");
  if(d.cost!=null&&d.rev!=null&&d.op!=null&&d.op>d.rev)w.push("영업이익이 매출액보다 큽니다. 입력값을 확인해 주세요.");
  if(d.rev!=null&&d.rev<=0)w.push("매출액이 0 이하면 이익률을 계산할 수 없습니다.");
  return w;
}
function render(){
  const d=read(),w=check(d),n=$("notice");
  n.hidden=!w.length; n.textContent=w.join(" ");
  const need=["rev","op","ni","ta","tl"];
  if(need.some(k=>d[k]==null||Number.isNaN(d[k]))||d.ta<=0||d.rev<=0){
    $("report").innerHTML=`<div class="rhead"><strong>재무 건강검진 결과지</strong></div><p>매출액, 영업이익, 당기순이익, 자산총계, 부채총계를 넣으면 결과지가 나옵니다. 나머지 칸을 채울수록 항목이 늘어납니다.</p>`;
    return;
  }
  const ind=$("industry").value,size=sizeBand(d.ta),r=compute(d),eq=d.ta-d.tl;
  const rows=[];
  for(const k of Object.keys(M)){
    const m=M[k]; let v=r[k],score=null,base=pick(ind,size,k),note="";
    if(k==="debt"&&eq<=0){score=2.5;note="자본잠식"}
    else if(k==="icr"&&d.int===0){score=97.5;note="이자비용 없음"}
    else if(v==null)continue;
    else{const p=pctile(base.q,v);score=m.good==="high"?p:100-p}
    const q=base.q;
    rows.push({k,m,v,score,base,note,med:q[9],lo:q[4],hi:q[14]});
  }
  const areaScore={};
  for(const a of AREAS){const s=rows.filter(x=>x.m.area===a);areaScore[a]=s.length?s.reduce((t,x)=>t+x.score,0)/s.length:null}
  const av=AREAS.map(a=>areaScore[a]).filter(x=>x!=null);
  const total=Math.round(av.reduce((a,b)=>a+b,0)/av.length);
  const [gl,gc]=grade(total);

  const flags=[];
  if(eq<=0)flags.push("자본잠식: 부채가 자산보다 많습니다. 금융기관 거래와 입찰 자격에 영향이 있을 수 있어 먼저 확인이 필요합니다.");
  if(r.icr!=null&&r.icr<1)flags.push("이자보상배율 1배 미만: 영업이익으로 이자를 다 내지 못합니다.");
  if(r.current!=null&&r.current<100)flags.push("유동비율 100% 미만: 1년 안에 갚을 빚이 현금화할 자산보다 많습니다.");
  if(d.op<0)flags.push("영업손실: 본업에서 적자입니다.");

  const money=[];
  const row=k=>rows.find(x=>x.k===k);
  const a=row("ard");
  if(a&&a.v>a.med)money.push(["매출채권 회수를 업종 중간 수준으로 당기면",won((a.v-a.med)/365*d.rev),`지금 ${fmt(a.v,"day")} → 중간값 ${fmt(a.med,"day")}. 그만큼 묶인 현금이 풀립니다.`]);
  const i=row("invd");
  if(i&&i.v>i.med)money.push(["재고 보유일을 업종 중간 수준으로 줄이면",won((i.v-i.med)/365*d.cost),`지금 ${fmt(i.v,"day")} → 중간값 ${fmt(i.med,"day")}. 그만큼 묶인 현금이 풀립니다.`]);
  const o=row("opm");
  if(o&&o.v<o.med)money.push(["영업이익률이 업종 중간 수준이면 영업이익이",won((o.med-o.v)/100*d.rev),`지금 ${fmt(o.v,"pct")} → 중간값 ${fmt(o.med,"pct")}. 같은 매출에서 연간 이만큼 차이가 납니다.`]);

  const weak=rows.filter(x=>x.score<40&&TIPS[x.k]).sort((p,q)=>p.score-q.score).slice(0,3);
  const strong=rows.filter(x=>x.score>=60).sort((p,q)=>q.score-p.score).slice(0,3);
  const main=pick(ind,size,"opm");

  let body="";
  for(const ar of AREAS){
    const s=rows.filter(x=>x.m.area===ar);
    if(!s.length)continue;
    body+=`<tr class="grp"><td colspan="5">${ar}</td></tr>`;
    for(const x of s){
      const [l,c]=itemGrade(x.score);
      const fm=x.m.fmt,v=x.note||fmt(x.v,fm);
      body+=`<tr><td>${x.m.name}<div class="opt">${x.m.desc}</div></td><td class="n mine">${v}</td><td class="n">${fmt(x.lo,fm)} ~ ${fmt(x.hi,fm)}</td><td><div class="bar" role="img" aria-label="같은 그룹 내 상위 ${Math.round(100-x.score)}% 부근"><div class="iq"></div><div class="med"></div><div class="me" style="left:${x.score.toFixed(1)}%"></div></div></td><td class="n"><span class="pill ${c}">${l}</span></td></tr>`;
    }
  }
  const verdict=total>=60?"같은 그룹에서 재무 상태가 앞쪽에 있습니다.":total>=40?"같은 그룹의 중간 정도입니다.":total>=25?"같은 그룹보다 뒤처진 항목이 있어 점검이 필요합니다.":"같은 그룹에서 뒤쪽에 있어 항목별 정밀 점검을 권합니다.";

  $("report").innerHTML=`
  <div class="rhead"><strong>재무 건강검진 결과지${isSample?'<span class="example">예시 숫자</span>':""}</strong><span>${main.label} · 비교 ${main.n.toLocaleString("ko-KR")}곳 · 2025년 결산</span></div>
  <section class="summary">
    <div class="score">${total}<small>/100</small></div>
    <div><p class="verdict"><span class="pill ${gc}">${gl}</span> ${verdict}</p>
    <p class="sub">점수는 건강 상태의 절대 평가가 아니라 비교 그룹 안에서의 위치입니다. 50이 중간입니다.</p></div>
  </section>
  <section class="areas">${AREAS.map(ar=>{const s=areaScore[ar];if(s==null)return `<div class="area"><b>${ar}</b><i>–</i><span class="opt">입력 부족</span></div>`;const [l,c]=grade(s);return `<div class="area"><b>${ar}</b><i>${Math.round(s)}</i><span><span class="pill ${c}">${l}</span></span></div>`}).join("")}</section>
  ${flags.length?`<section><h2>먼저 확인할 신호</h2><ul class="flags">${flags.map(f=>`<li>${f}</li>`).join("")}</ul></section>`:""}
  ${money.length?`<section><h2>금액으로 보면</h2><ul class="money">${money.map(m=>`<li><b>${m[0]}</b><em>${m[1]}</em><span>${m[2]}</span></li>`).join("")}</ul></section>`:""}
  <section><h2>항목별 결과</h2><div class="tblwrap"><table>
    <thead><tr><th>항목</th><th class="n">우리 회사</th><th class="n">같은 그룹 보통 범위</th><th><div class="axis"><span>뒤쪽</span><span>중간</span><span>앞쪽</span></div></th><th class="n">판정</th></tr></thead>
    <tbody>${body}</tbody></table></div>
    <p class="opt">보통 범위는 비교 그룹의 중간 50%입니다. 막대의 진한 구간이 그 범위, 점이 우리 회사이며, 오른쪽일수록 좋은 쪽입니다. 진한 구간 안이면 보통, 오른쪽 밖이면 양호, 왼쪽 밖이면 주의, 맨 뒤 10%는 정밀 점검으로 표시합니다. 항목별로 값이 있는 회사만 비교합니다.</p>
  </section>
  ${weak.length?`<section><h2>점검해 볼 항목</h2><ul class="tips">${weak.map(x=>`<li><b>${x.m.name}</b><span>${TIPS[x.k]}</span></li>`).join("")}</ul></section>`:""}
  ${strong.length?`<section><h2>강점</h2><p style="margin:0">${strong.map(x=>x.m.name).join(", ")} 항목이 같은 그룹에서 앞쪽에 있습니다. 은행이나 거래처에 회사를 설명할 때 근거로 쓸 수 있습니다.</p></section>`:""}
  <div class="btns"><button type="button" id="copy">결과 요약 복사</button><button type="button" class="primary" id="print" hidden>결과지 인쇄·PDF 저장</button></div>
  <div class="foot">
    <p class="contact">결과가 궁금하시면 해설해 드립니다. 지인회계법인 이재강 회계사 010-6624-2061</p>
    <p>비교 자료: 금융감독원 전자공시(DART)에 2026년 상반기 공시된 비상장 회사의 2025년 12월 결산 감사보고서 중 무작위 표본 ${B.meta.used.toLocaleString("ko-KR")}곳, 업종별 비교는 그중 업종을 확인한 ${B.meta.usedInd.toLocaleString("ko-KR")}곳(K-IFRS 적용 회사, 자산 1,500억 초과 회사, 확인된 금융업 제외). 외부감사를 받는 회사 기준이라 규모가 작은 회사나 개인사업자는 차이가 날 수 있습니다.</p>
    <p>이 결과지는 입력한 숫자로 계산한 참고 자료이며 감사의견, 신용평가, 투자·세무 판단이 아닙니다.</p>
  </div>`;
  const c=$("copy");
  if(c)c.onclick=()=>{
    const t=`[재무 건강검진 결과] ${total}/100 (${gl}) / ${main.label}\n`+AREAS.map(ar=>areaScore[ar]==null?null:`${ar} ${Math.round(areaScore[ar])}`).filter(Boolean).join(", ")+"\n"+rows.map(x=>`${x.m.name}: ${x.note||fmt(x.v,x.m.fmt)} (보통 ${fmt(x.lo,x.m.fmt)}~${fmt(x.hi,x.m.fmt)})`).join("\n");
    const done=()=>{c.textContent="복사했습니다"};
    navigator.clipboard.writeText(t).then(done,()=>{c.textContent="복사하지 못했습니다"});
  };
  const pr=$("print");
  if(pr&&location.hostname.endsWith("github.io")){pr.hidden=false;pr.onclick=()=>window.print()}
}
function fill(o){for(const k of Object.keys(o))$(k).value=o[k]}
function init(){
  const names=Object.keys(B.ind).sort((a,b)=>a.localeCompare(b,"ko"));
  $("industry").innerHTML=names.map(n=>`<option>${n}</option>`).join("")+`<option value="">해당 없음 (전 업종과 비교)</option>`;
  fill(SAMPLE);
  $("form").addEventListener("input",()=>{isSample=false;render()});
  $("form").addEventListener("submit",e=>e.preventDefault());
  $("clear").onclick=()=>{for(const k of FIELDS)$(k).value="";isSample=false;render()};
  $("sample").onclick=()=>{fill(SAMPLE);isSample=true;render()};
  render();
}
init();
</script>
</body>
</html>
